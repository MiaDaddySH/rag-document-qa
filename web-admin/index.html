<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Web Admin</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>RAG Web Admin</h1>
    <p class="subtitle">Upload a PDF, index it, and ask questions.</p>

    <section class="card">
      <h2>1. Upload PDF</h2>
      <input type="file" id="pdfFile" accept="application/pdf" />
      <button id="uploadBtn">Upload</button>
      <p id="uploadStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>2. Index Document</h2>
      <label for="filenameInput">Filename</label>
      <input type="text" id="filenameInput" placeholder="example.pdf" />

      <div class="row">
        <div class="field">
          <label for="chunkSize">Chunk Size</label>
          <input type="number" id="chunkSize" value="500" min="1" />
        </div>
        <div class="field">
          <label for="chunkOverlap">Chunk Overlap</label>
          <input type="number" id="chunkOverlap" value="100" min="0" />
        </div>
      </div>

      <button id="indexBtn">Index Document</button>
      <p id="indexStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>3. Ask a Question</h2>
      <label for="questionInput">Question</label>
      <textarea
        id="questionInput"
        rows="4"
        placeholder="What is this document mainly about?"
      ></textarea>

      <label for="topKInput">Top K</label>
      <input type="number" id="topKInput" value="3" min="1" />

      <button id="askBtn">Ask</button>
      <p id="askStatus" class="status"></p>

      <div class="result-block">
        <h3>Answer</h3>
        <pre id="answerOutput" class="output"></pre>
      </div>

      <div class="result-block">
        <h3>Retrieved Chunks</h3>
        <pre id="chunksOutput" class="output"></pre>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
